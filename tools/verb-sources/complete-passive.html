<style>
:root{--p-pp4:#23487B; --p-pp4-bg:#DAE4F1; --p-agree:#7F2756; --p-agree-bg:#F4DDE9; --p-est:#2F5331; --p-est-bg:#DDEBDC; --p-erunt:#7C3112; --p-erunt-bg:#FADFCF;}
/* two-word forms (amātī erāmus) need wider charts */
.vgroups .charts.three-up,.has-sb .vgroups .charts.three-up{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.vgroups .cell .fm{white-space:nowrap}
@media (max-width:640px){.vgroups .charts.three-up,.has-sb .vgroups .charts.three-up{grid-template-columns:1fr}.vgroups .three-up .cell{font-size:1.0625rem;padding:10px 4px}}

<body>
<div class="wrap">
<header>
  <h1>Complete Passives</h1>
  <div class="primer"></div>
</header>

<section id="background" class="bg">
</section>

<section id="charts">
  <div class="toolbar">
    <div class="tb-row" id="patterns"><span class="tb-label">Highlight a pattern</span></div>
    <div class="tb-row">
      <span class="tb-label">View</span>
      <div class="seg">
      <button class="chip plain" id="t-mac" aria-pressed="true">Show macrons (ā ē ī ō ū)</button>
      <button class="chip plain" id="t-end" aria-pressed="false">Emphasize endings</button>
      <button class="chip plain" id="t-en" aria-pressed="false">Show English</button>
      </div>
    </div>
    <div class="pnotes" id="pnotes"></div>
  </div>

  <div class="work">
    <div class="charts-col" id="charts-col">
      <div class="charts three-up" id="charts-grid"></div>
      <div id="er" hidden><div id="er-grid"></div></div>
    </div>
    <aside class="panel" aria-live="polite"><div class="card" id="card"></div></aside>
  </div>
</section>

<footer class="cite">
  <h4>Sources</h4>
  <p>Paradigms follow J. H. Allen and J. B. Greenough, <i>Allen and Greenough's New Latin Grammar for Schools and Colleges</i> (Boston: Ginn &amp; Co., 1903), in the <a href="https://dcc.dickinson.edu/grammar/latin" target="_blank" rel="noopener">Dickinson College Commentaries online edition</a>.</p>
</footer>
</div>

<script src="../js/verb-chart.js?v=202610011500"></script>
<script>
const SUB = ['I','you','he/she/it','we','you (all)','they'];
const HAVE = ['have','have','has','have','have','have'];
const WAS = ['was','were','was','were','were','were'];
const SUM = {perf:['sum','es','est','sumus','estis','sunt'], plup:['eram','erās','erat','erāmus','erātis','erant'], fp:['erō','eris','erit','erimus','eritis','erunt']};
const CP = (st, g) => SUM[g].map((x, i) => [st, i < 3 ? 'us' : 'ī', '', ' ' + x]);
const PP = {amo:'loved', moneo:'warned', rego:'ruled', capio:'taken', audio:'heard'};
const STEM = {amo:'amāt', moneo:'monit', rego:'rēct', capio:'capt', audio:'audīt'};
const D = {amo:['amō, amāre, amāvī, amātus','1st conjugation · love'], moneo:['moneō, monēre, monuī, monitus','2nd conjugation · warn'], rego:['regō, regere, rēxī, rēctus','3rd conjugation · rule'],
           capio:['capiō, capere, cēpī, captus','3rd conjugation -iō · take'], audio:['audiō, audīre, audīvī, audītus','4th conjugation · hear']};
const IDS = ['amo','moneo','rego','capio','audio'];
const mk = (id, g) => ({id, group:g, dict:D[id][0], meta:D[id][1], f:CP(STEM[id], g)});
VerbChart({
  groups: [{id:'perf', name:'Perfect'}, {id:'plup', name:'Pluperfect'}, {id:'fp', name:'Future perfect'}],
  verbs: ['perf','plup','fp'].flatMap(g => IDS.map(id => mk(id, g))),
  english: c => {
    const s = SUB[c.i], pp = PP[c.verb.id];
    if(c.verb.group === 'perf') return {main:`${s} ${HAVE[c.i]} been ${pp}`, alt:`${s} ${WAS[c.i]} ${pp}`};
    if(c.verb.group === 'plup') return {main:`${s} had been ${pp}`, alt:''};
    return {main:`${s} will have been ${pp}`, alt:''};
  },
  labels: c => ({st:'participle stem, from the 4th principal part', vw:'participle ending, agreeing with the subject', ts:'',
                 en: {perf:'present of sum', plup:'imperfect of sum', fp:'future of sum'}[c.verb.group]}),
  patterns: [
    {id:'pp4', lab:'amāt-', txt:'stem from the 4th principal part', part:'st', test:c=>true,
     note:'<b>The participle comes from the 4th principal part.</b> For most 1st and 4th conjugation verbs it is regular (<i>amātus, audītus</i>), but many others have to be learned with the verb: <i>monitus, rēctus, captus</i>.'},
    {id:'agree', lab:'-us / -ī', txt:'the participle agrees with the subject', part:'vw', test:c=>true,
     note:'<b>The participle agrees with the subject.</b> It is an adjective, so its ending shows the gender and number of the subject. The charts show the masculine: <i>-us</i> in the singular, <i>-ī</i> in the plural. A feminine subject takes <i>-a, -ae</i> (<i>amāta est, amātae sunt</i>), and a neuter one <i>-um, -a</i> (<i>amātum est, amāta sunt</i>).'},
    {id:'est', lab:'est', txt:'the perfect uses the present of sum', part:'en', test:c=>c.verb.group === 'perf',
     note:'<b>The perfect passive uses the present of sum, but it does not mean "is."</b> The participle already describes a finished action, so <i>amātus est</i> is "he has been loved" or "he was loved," not "he is loved." The same shift runs through all three tenses: <i>eram</i> ("I was") gives "had been," and <i>erō</i> ("I will be") gives "will have been."'},
    {id:'erunt', lab:'erunt', txt:'future perfect 3rd pl.', part:'en', test:c=>c.verb.group === 'fp' && c.p.k === '3pl',
     note:'<b>The future perfect passive has erunt, not erint.</b> It uses the ordinary future of <i>sum</i> (<i>erō, eris, erit, erimus, eritis, erunt</i>), so <i>amātī erunt</i>. Compare the active <i>amāverint</i>, where the ending is <i>-erint</i>.'}
  ],
  notes: {
    'amo.perf.1sg':'<i>amātus sum</i>: "I have been loved" or "I was loved." The <i>sum</i> gives the person and number; the participle makes the action finished.',
    'amo.perf.3sg':'<i>amātus est</i>: not "he is loved," which would be <i>amātur</i>.',
    'amo.perf.3pl':'<i>amātī sunt</i>: the participle is plural to match "they."',
    'amo.plup.3sg':'<i>amātus erat</i>: the imperfect of <i>sum</i> (<i>erat</i>, "he was") gives "he had been loved."',
    'amo.fp.3sg':'<i>amātus erit</i>: the future of <i>sum</i> (<i>erit</i>, "he will be") gives "he will have been loved."',
    'amo.fp.3pl':'<i>amātī erunt</i>, not <i>*amātī erint</i>: the ordinary future of <i>sum</i>.',
    'moneo.perf.3sg':'<i>monitus est</i>: the 2nd conjugation participle usually ends in <i>-itus</i>, not <i>*monētus</i>.',
    'rego.perf.3sg':'<i>rēctus est</i>: the <i>g</i> of <i>reg-</i> becomes <i>c</i> before the <i>t</i>, and the <i>e</i> is long. Learn the participle with the verb.',
    'capio.perf.3sg':'<i>captus est</i>: the <i>i</i> of <i>capiō</i> does not appear in the participle.'
  },
  idle: "You'll see how to translate the form, and how it is built from a participle and a form of sum."
});
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level banners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
<link rel="stylesheet" href="css/site.css?v=202609301800">
</head>
<body>
<main class="wrap">
  <header class="page-head">
    <h1>Level banners</h1>
    <p class="subtitle">Preview of the four level banners</p>
  </header>

  <figure class="level-banner" id="latin1">
    <div class="frame">
      <img src="img/banners/latin1-vercingetorix.webp" srcset="img/banners/latin1-vercingetorix-800.webp 800w, img/banners/latin1-vercingetorix.webp 1600w" sizes="(max-width:800px) 100vw, 760px" style="--focus:50% 45%" alt="Vercingetorix, on a white horse, surrenders to Julius Caesar, who sits in a red cloak among his officers.">
      <div class="title"><span class="eyebrow">Level 1</span><h1>Latin I</h1></div>
    </div>
    <figcaption>Lionel Royer, <cite>Vercingetorix Throws Down His Arms at the Feet of Julius Caesar</cite>, 1899</figcaption>
  </figure>

  <figure class="level-banner" id="latin2">
    <div class="frame">
      <img src="img/banners/latin2-nero.webp" srcset="img/banners/latin2-nero-800.webp 800w, img/banners/latin2-nero.webp 1600w" sizes="(max-width:800px) 100vw, 760px" style="--focus:62% 50%" alt="Nero, in a red robe, lies brooding on a couch in an empty marble room.">
      <div class="title"><span class="eyebrow">Level 2</span><h1>Latin II</h1></div>
    </div>
    <figcaption>John William Waterhouse, <cite>The Remorse of Nero after the Murder of His Mother</cite>, 1878</figcaption>
  </figure>

  <figure class="level-banner" id="latin3">
    <div class="frame">
      <img src="img/banners/latin3-course-of-empire.webp" srcset="img/banners/latin3-course-of-empire-800.webp 800w, img/banners/latin3-course-of-empire.webp 1600w" sizes="(max-width:800px) 100vw, 760px" style="--focus:55% 50%" alt="A classical city burns as invaders fight across a collapsing bridge beneath a headless colossal statue.">
      <div class="title"><span class="eyebrow">Level 3</span><h1>Latin III</h1></div>
    </div>
    <figcaption>Thomas Cole, <cite>The Course of Empire: Destruction</cite>, 1836</figcaption>
  </figure>

  <figure class="level-banner" id="latin4">
    <div class="frame">
      <img src="img/banners/latin4-cleopatra.webp" srcset="img/banners/latin4-cleopatra-800.webp 800w, img/banners/latin4-cleopatra.webp 1600w" sizes="(max-width:800px) 100vw, 760px" style="--focus:50% 35%" alt="Cleopatra, in a white gown and golden crown, sits on a leopard-skin couch and stares out at the viewer.">
      <div class="title"><span class="eyebrow">Level 4</span><h1>Latin IV</h1></div>
    </div>
    <figcaption>John William Waterhouse, <cite>Cleopatra</cite>, 1888</figcaption>
  </figure>
</main>
</body>
</html>
